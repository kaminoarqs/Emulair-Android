name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '11'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle Executable
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          elif [ -f "./android/gradlew" ]; then
            chmod +x ./android/gradlew
          fi

      - name: Force Global Legacy Repositories
        run: |
          mkdir -p ~/.gradle
          cat << 'EOF' > ~/.gradle/init.gradle
          allprojects {
              buildscript {
                  repositories {
                      google()
                      mavenCentral()
                      maven { url "https://jitpack.io" }
                      maven { url "https://gradle.org" }
                  }
              }
              repositories {
                  google()
                  mavenCentral()
                  maven { url "https://jitpack.io" }
                  maven { url "https://gradle.org" }
              }
          }
          EOF

      - name: Nuke Broken Version Checking Plugin Everywhere
        run: |
          # Recursively finds all gradle files, kotlin scripts, and properties files to delete the broken plugin lines
          find . -type f \( -name "*.gradle" -o -name "*.kts" -o -name "*.properties" \) -exec sed -i '/com.github.ben-manes/d' {} +
          find . -type f \( -name "*.gradle" -o -name "*.kts" -o -name "*.properties" \) -exec sed -i '/gradle-versions-plugin/d' {} +

      - name: Build Debug APK
        env:
          GRADLE_OPTS: "-Xmx2048m -XX:MaxMetaspaceSize=512m"
        run: |
          if [ -f "./gradlew" ]; then
              ./gradlew assembleDebug --no-build-cache
          elif [ -d "android" ]; then
              cd android && ./gradlew assembleDebug --no-build-cache
          else
              echo "Gradle wrapper not found!" && exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: emulator-debug-apk
          path: |
            **/build/outputs/apk/debug/*.apk
            
