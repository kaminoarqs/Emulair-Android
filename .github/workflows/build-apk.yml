name: Android CI Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # This adds a manual button to start the build

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Java Environment
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '11' # Jetpack Compose usually requires Java 17

    - name: Grant Execute Permission for Gradle
      run: chmod +x gradlew

    - name: Inject Fallback Repositories for Dead Dependencies
      run: |
        # This injects a public archive mirror into the build configuration so it can find the missing touch library
        sed -i "s|repositories {|repositories {\n        maven { url 'https://aliyun.com' }\n        maven { url 'https://jitpack.io' }|g" build.gradle || true

    - name: Compile and Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload Finished APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: emulair-debug-apk
        path: app/build/outputs/apk/debug/*.apk
        
