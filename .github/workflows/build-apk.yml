name: Android CI Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Java Environment
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '11'

    - name: Grant Execute Permission for Gradle
      run: chmod +x gradlew

    - name: Inject Fallback Mirrors Into All Projects
      run: |
        # This appends a global rule to the master settings forcing every sub-module to use working archive mirrors
        echo -e "\nallprojects {\n    repositories {\n        maven { url 'https://aliyun.com' }\n        maven { url 'https://jitpack.io' }\n    }\n}" >> build.gradle

    - name: Compile and Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload Finished APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: emulair-debug-apk
        path: app/build/outputs/apk/debug/*.apk
