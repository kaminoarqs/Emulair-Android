name: Android CI Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Java Environment
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '11'

    - name: Grant Execute Permission for Gradle
      run: chmod +x gradlew

    - name: Force Mirrors into Every Module Configuration
      run: |
        # This scans the entire project structure and forces the fallback mirrors into every single build file
        find . -name "build.gradle" -exec sed -i "s|repositories {|repositories {\n        maven { url 'https://aliyun.com' }\n        maven { url 'https://jitpack.io' }|g" {} +
        
    - name: Compile and Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload Finished APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: emulair-debug-apk
        path: app/build/outputs/apk/debug/*.apk
        
