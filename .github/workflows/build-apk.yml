name: Android CI Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Java Environment
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '11'

    - name: Grant Execute Permission for Gradle
      run: chmod +x gradlew

    - name: Strip Dead Dependencies Out of Code
      run: |
        # Force-remove the missing dependency lines from every gradle file across the project
        find . -name "build.gradle" -exec sed -i "/com.dinuscxj:multitouchgesturedetector/d" {} +
        find . -name "build.gradle" -exec sed -i "/multitouchgesturedetector/d" {} +

       
    - name: Compile and Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload Finished APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: emulair-debug-apk
        path: app/build/outputs/apk/debug/*.apk
        
