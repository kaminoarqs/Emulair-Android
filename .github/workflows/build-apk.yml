name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '11'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle Executable
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          elif [ -f "./android/gradlew" ]; then
            chmod +x ./android/gradlew
          fi

      - name: Force Global Legacy Repositories & Bypass Broken Plugins
        run: |
          mkdir -p ~/.gradle
          cat << 'EOF' > ~/.gradle/init.gradle
          allprojects {
              buildscript {
                  repositories {
                      google()
                      mavenCentral()
                      maven { url "https://jitpack.io" }
                      maven { url "https://gradle.org" }
                  }
                  configurations.all {
                      resolutionStrategy {
                          // Forces Gradle to substitute the broken dependency path with a working version
                          eachDependency { DependencyResolveDetails details ->
                              if (details.requested.group == 'com.github.ben-manes') {
                                  details.useVersion '0.39.0'
                              }
                          }
                      }
                  }
              }
              repositories {
                  google()
                  mavenCentral()
                  maven { url "https://jitpack.io" }
                  maven { url "https://gradle.org" }
              }
          }
          EOF

      - name: Build Debug APK
        env:
          GRADLE_OPTS: "-Xmx2048m -XX:MaxMetaspaceSize=512m"
        run: |
          # Added --no-build-cache and excluding the faulty version check task entirely
          if [ -f "./gradlew" ]; then
              ./gradlew assembleDebug -x dependencyUpdates --no-build-cache
          elif [ -d "android" ]; then
              cd android && ./gradlew assembleDebug -x dependencyUpdates --no-build-cache
          else
              echo "Gradle wrapper not found!" && exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: emulator-debug-apk
          path: |
            **/build/outputs/apk/debug/*.apk
            
