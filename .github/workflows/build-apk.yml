name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '11'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle Executable
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          elif [ -f "./android/gradlew" ]; then
            chmod +x ./android/gradlew
          fi

      - name: Inject Legacy Repository Mirrors
        run: |
          # Finds the build.gradle files and forces them to use JitPack and public JCenter archives as fallbacks
          find . -name "build.gradle" -exec sed -i 's/jcenter()/jcenter()\n        maven { url "https://jitpack.io" }\n        maven { url "https://gradle.org" }/g' {} +
          find . -name "settings.gradle" -exec sed -i 's/jcenter()/jcenter()\n        maven { url "https://jitpack.io" }\n        maven { url "https://gradle.org" }/g' {} +

      - name: Build Debug APK
        env:
          GRADLE_OPTS: "-Xmx2048m -XX:MaxMetaspaceSize=512m"
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug
          elif [ -d "android" ]; then
            cd android && ./gradlew assembleDebug
          else
            echo "Gradle wrapper not found in root or android directory!" && exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: emulator-debug-apk
          path: |
            **/build/outputs/apk/debug/*.apk
            
